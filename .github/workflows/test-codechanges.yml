name: Test Code Changes Tracker

on:
  push:
    branches:
      - main
      - feature/diff-capture  # For testing
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  test-codechanges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - Print API Key
        run: |
          echo "Using API Key: ${{ secrets.PIE_API_KEY }}"

      - name: Test Code Changes Action
        uses: ./  # Uses the action from current repository
        with:
          pie_api_key: ${{ secrets.PIE_API_KEY }}

